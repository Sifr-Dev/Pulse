org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.builtInKotlin=true
# KSP 2.2.10-2.0.2 still registers generated sources with the removed kotlin.sourceSets DSL.
# AGP 9.5.2 exposes this explicitly experimental compatibility switch; generated sources are
# covered by Room compilation/schema tests. Remove it after a compatible KSP/AGP migration.
android.disallowKotlinSourceSets=false
kotlin.code.style=official
